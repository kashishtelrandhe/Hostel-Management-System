
{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Rooms</h3>
  <a class="btn btn-success" href="{{ url_for('add_room') }}">Add Room</a>
</div>
<div class="card shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th><th>Room No</th><th>Capacity</th><th>Occupied</th><th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for r in rooms %}
          <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.room_no }}</td>
            <td>{{ r.capacity }}</td>
            <td>{{ r.occupied }}</td>
            <td>
              <form method="post" action="{{ url_for('vacate_room', rid=r.id) }}" style="display:inline" onsubmit="return confirm('Vacate this room?');">
                <button class="btn btn-sm btn-warning">Vacate</button>
              </form>
            </td>
          </tr>
          {% else %}
          <tr><td colspan="5" class="text-center py-4">No rooms found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
